name: Android AAB

# Builds the signed Play bundle from the same index.html the web version uses.
# Run it from the Actions tab (Run workflow). The signed .aab is attached to the
# run as an artifact; upload that file to Play Console.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'What changed (goes into the run title only)'
        required: false
        default: ''

run-name: AAB ${{ github.run_number }} ${{ inputs.notes }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Put the game inside the app
        run: |
          set -e
          W=android/app/src/main/assets/www
          mkdir -p "$W"
          cp index.html manifest.json icon-192.png icon-512.png icon-512-maskable.png "$W"/
          cp -r music "$W"/
          # inside the app every file is already on the phone; the web service worker is not needed
          before=$(grep -c "navigator.serviceWorker.register('sw.js')" "$W/index.html")
          sed -i "s/if('serviceWorker' in navigator){/if(false\&\&'serviceWorker' in navigator){/" "$W/index.html"
          test "$before" = "1"
          grep -q "if(false&&'serviceWorker' in navigator){" "$W/index.html"
          echo "VERSION_NAME=$(grep -o "mwmogul-v[0-9.]*" sw.js | head -1 | sed 's/mwmogul-v//')" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}0
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease

      - name: Name the file
        run: |
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/MegawattMogul-v${VERSION_NAME}-vc${{ github.run_number }}0.aab"
          rm -f "$RUNNER_TEMP/upload.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: MegawattMogul-aab-${{ github.run_number }}
          path: out/*.aab
          retention-days: 30
