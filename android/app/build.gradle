plugins {
    id 'com.android.application'
}

android {
    namespace 'games.baseload.megawattmogul'
    compileSdk 36

    defaultConfig {
        applicationId 'games.baseload.megawattmogul'
        minSdk 24
        targetSdk 36
        // CI passes a number that only ever grows; 10 is the floor above the old TWA builds
        versionCode((System.getenv('VERSION_CODE') ?: '10') as int)
        versionName(System.getenv('VERSION_NAME') ?: '0.95.0')
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_PATH') ?: 'missing.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // the game file and the music are already compressed or tiny; keep them stored
    androidResources {
        noCompress += ['mp3']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.play:review:2.0.2'
    // review pulls very old AndroidX (activity 1.0.0, fragment 1.1.0, core 1.2.0) that Play flags as outdated;
    // pin current releases so Gradle resolves to them instead
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.core:core:1.13.1'
}

// The newer AndroidX brings kotlin-stdlib 1.8, which already contains the old stdlib-jdk7/jdk8 classes;
// review still drags in stdlib-jdk7/jdk8 1.6 -> duplicate classes. Leave the old split jars out.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
